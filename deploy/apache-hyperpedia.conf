# Install as /etc/apache2/sites-available/hyperpedia.conf after adding the cert.
<VirtualHost *:80>
    ServerName hyperpedia.app
    ServerAlias www.hyperpedia.app
    Redirect permanent / https://hyperpedia.app/
</VirtualHost>

<VirtualHost *:443>
    ServerName hyperpedia.app
    ServerAlias www.hyperpedia.app

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/hyperpedia.app.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/hyperpedia.app.key

    Header always set Strict-Transport-Security "max-age=31536000"

    # Enable mod_remoteip. Trust this header only from Cloudflare's published edges.
    # https://www.cloudflare.com/ips/ (verified 2026-10-31)
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Host
    # Overwrite this header; never trust a client-supplied value.
    RequestHeader set X-Hyperpedia-Client-IP "expr=%{REMOTE_ADDR}"

    ProxyPass / http://127.0.0.1:18081/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:18081/

    ErrorLog ${APACHE_LOG_DIR}/hyperpedia-error.log
    LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" hyperpedia_combined
    CustomLog ${APACHE_LOG_DIR}/hyperpedia-access.log hyperpedia_combined
</VirtualHost>
