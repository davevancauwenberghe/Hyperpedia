# Install as /etc/apache2/sites-available/hyperpedia.conf after adding the cert.
<VirtualHost *:80>
    ServerName hyperpedia.app
    ServerAlias www.hyperpedia.app
    Redirect permanent / https://hyperpedia.app/
</VirtualHost>

<VirtualHost *:443>
    ServerName hyperpedia.app
    ServerAlias www.hyperpedia.app

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/hyperpedia.app.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/hyperpedia.app.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Host
    # Overwrite this header; never trust a client-supplied value.
    RequestHeader set X-Hyperpedia-Client-IP "expr=%{REMOTE_ADDR}"

    ProxyPass / http://127.0.0.1:18081/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:18081/

    ErrorLog ${APACHE_LOG_DIR}/hyperpedia-error.log
    CustomLog ${APACHE_LOG_DIR}/hyperpedia-access.log combined
</VirtualHost>
