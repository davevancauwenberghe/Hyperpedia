/var/log/apache2/hyperpedia/*.log {
    daily
    rotate 13
    maxage 14
    ifempty
    missingok
    compress
    delaycompress
    create 0640 root adm
    sharedscripts
    postrotate
        if /usr/bin/systemctl --quiet is-active apache2.service; then
            /usr/bin/systemctl reload apache2.service
        fi
    endscript
}
